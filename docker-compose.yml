version: '3.8'

services:
  # SentiTube API
  sentiment-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentitube-api
    ports:
      - "8080:8080"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./mlruns:/app/mlruns
    environment:
      - FLASK_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MLflow Tracking Server
  mlflow:
    image: python:3.10-slim
    container_name: mlflow-server
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlflow/mlruns
    working_dir: /mlflow
    command: >
      sh -c "pip install mlflow boto3 &&
             mlflow server 
             --backend-store-uri sqlite:///mlflow.db
             --default-artifact-root ./mlruns
             --host 0.0.0.0
             --port 5000"
    restart: unless-stopped

networks:
  default:
    name: sentitube-network
