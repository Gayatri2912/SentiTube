<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentiTube - AI-Powered YouTube Sentiment Analysis</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        .input-section {
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
            font-size: 1.1em;
        }

        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            font-family: inherit;
            resize: vertical;
            min-height: 120px;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 15px 30px;
            font-size: 1.1em;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-predict {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-predict:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-clear {
            background: #f0f0f0;
            color: #666;
        }

        .btn-clear:hover {
            background: #e0e0e0;
        }

        .result-section {
            margin-top: 30px;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 15px;
            display: none;
        }

        .result-section.show {
            display: block;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .sentiment-display {
            text-align: center;
            margin-bottom: 25px;
        }

        .sentiment-label {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .sentiment-positive {
            color: #4caf50;
        }

        .sentiment-negative {
            color: #f44336;
        }

        .sentiment-neutral {
            color: #ff9800;
        }

        .confidence {
            font-size: 1.2em;
            color: #666;
        }

        .probabilities {
            margin-top: 25px;
        }

        .prob-title {
            font-weight: 600;
            margin-bottom: 15px;
            color: #333;
        }

        .prob-bar {
            margin-bottom: 15px;
        }

        .prob-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 0.95em;
        }

        .prob-bg {
            background: #e0e0e0;
            height: 30px;
            border-radius: 15px;
            overflow: hidden;
        }

        .prob-fill {
            height: 100%;
            border-radius: 15px;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            padding-left: 10px;
            color: white;
            font-weight: 600;
        }

        .prob-positive {
            background: linear-gradient(90deg, #4caf50, #66bb6a);
        }

        .prob-negative {
            background: linear-gradient(90deg, #f44336, #ef5350);
        }

        .prob-neutral {
            background: linear-gradient(90deg, #ff9800, #ffa726);
        }

        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 SentiTube</h1>
            <p>AI-Powered YouTube Comment Sentiment Analyzer</p>
        </div>

        <div class="content">
            <div class="input-section">
                <label for="comment">Enter a YouTube Comment:</label>
                <textarea 
                    id="comment" 
                    placeholder="Type or paste a YouTube comment here..."
                    rows="4"
                ></textarea>
                
                <div class="button-group">
                    <button class="btn-predict" onclick="analyzeSentiment()">
                        🔍 Analyze Sentiment
                    </button>
                    <button class="btn-clear" onclick="clearAll()">
                        🗑️ Clear
                    </button>
                </div>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Analyzing sentiment...</p>
            </div>

            <div class="error" id="error"></div>

            <div class="result-section" id="results">
                <div class="sentiment-display">
                    <div class="sentiment-label" id="sentimentLabel"></div>
                    <div class="confidence" id="confidence"></div>
                </div>

                <div class="probabilities">
                    <div class="prob-title">Probability Distribution:</div>
                    
                    <div class="prob-bar">
                        <div class="prob-label">
                            <span>😊 Positive</span>
                            <span id="posPercent"></span>
                        </div>
                        <div class="prob-bg">
                            <div class="prob-fill prob-positive" id="posBar"></div>
                        </div>
                    </div>

                    <div class="prob-bar">
                        <div class="prob-label">
                            <span>😐 Neutral</span>
                            <span id="neuPercent"></span>
                        </div>
                        <div class="prob-bg">
                            <div class="prob-fill prob-neutral" id="neuBar"></div>
                        </div>
                    </div>

                    <div class="prob-bar">
                        <div class="prob-label">
                            <span>😠 Negative</span>
                            <span id="negPercent"></span>
                        </div>
                        <div class="prob-bg">
                            <div class="prob-fill prob-negative" id="negBar"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>SentiTube v1.0 | Powered by Machine Learning</p>
            <p style="font-size: 0.85em; margin-top: 5px;">Random Forest • XGBoost • LightGBM</p>
        </div>
    </div>

    <script>
        async function analyzeSentiment() {
            const comment = document.getElementById('comment').value.trim();
            
            if (!comment) {
                showError('Please enter a comment to analyze.');
                return;
            }

            // Hide previous results and errors
            document.getElementById('results').classList.remove('show');
            document.getElementById('error').classList.remove('show');
            
            // Show loading
            document.getElementById('loading').classList.add('show');

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ text: comment })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Prediction failed');
                }

                displayResults(data);
            } catch (error) {
                showError('Error: ' + error.message);
            } finally {
                document.getElementById('loading').classList.remove('show');
            }
        }

        function displayResults(data) {
            const sentiment = data.sentiment;
            const confidence = (data.confidence * 100).toFixed(1);
            const probs = data.probabilities;

            // Set sentiment label and color
            const sentimentLabel = document.getElementById('sentimentLabel');
            sentimentLabel.textContent = sentiment;
            sentimentLabel.className = 'sentiment-label sentiment-' + sentiment.toLowerCase();

            // Set confidence
            document.getElementById('confidence').textContent = `Confidence: ${confidence}%`;

            // Set probabilities
            const posProb = (probs.Positive * 100).toFixed(1);
            const neuProb = (probs.Neutral * 100).toFixed(1);
            const negProb = (probs.Negative * 100).toFixed(1);

            document.getElementById('posPercent').textContent = posProb + '%';
            document.getElementById('neuPercent').textContent = neuProb + '%';
            document.getElementById('negPercent').textContent = negProb + '%';

            document.getElementById('posBar').style.width = posProb + '%';
            document.getElementById('neuBar').style.width = neuProb + '%';
            document.getElementById('negBar').style.width = negProb + '%';

            // Show results
            document.getElementById('results').classList.add('show');
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
        }

        function clearAll() {
            document.getElementById('comment').value = '';
            document.getElementById('results').classList.remove('show');
            document.getElementById('error').classList.remove('show');
        }

        // Allow Enter key to submit (with Shift+Enter for new line)
        document.getElementById('comment').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                analyzeSentiment();
            }
        });
    </script>
</body>
</html>
