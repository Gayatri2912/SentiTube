# Configuration Parameters for SentiTube

# Data Ingestion
data_ingestion:
  sample_size: 10000  # Number of comments to sample
  test_size: 0.2
  random_state: 42
  stratify: true

# Data Preprocessing
preprocessing:
  remove_urls: true
  remove_mentions: true
  remove_hashtags: true
  remove_special_chars: true
  lowercase: true
  remove_stopwords: true
  lemmatize: true
  min_text_length: 3

# Feature Engineering
feature_engineering:
  vectorizer: "tfidf"
  tfidf:
    max_features: 5000
    ngram_range: [1, 2]
    max_df: 0.85
    min_df: 2
  additional_features:
    - text_length
    - word_count
    - exclamation_count
    - question_count
    - uppercase_ratio

# Imbalanced Data Handling
imbalance:
  method: "smote"  # Options: smote, adasyn, random_over, random_under
  sampling_strategy: "auto"
  k_neighbors: 5

# Model Training - Random Forest
random_forest:
  n_estimators: 200
  max_depth: 20
  min_samples_split: 5
  min_samples_leaf: 2
  max_features: "sqrt"
  random_state: 42
  n_jobs: -1

# Model Training - XGBoost
xgboost:
  n_estimators: 200
  max_depth: 7
  learning_rate: 0.1
  subsample: 0.8
  colsample_bytree: 0.8
  gamma: 0.1
  reg_alpha: 0.1
  reg_lambda: 1
  random_state: 42
  n_jobs: -1

# Model Training - LightGBM
lightgbm:
  n_estimators: 200
  max_depth: 7
  learning_rate: 0.1
  num_leaves: 31
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.1
  reg_lambda: 1
  random_state: 42
  n_jobs: -1
  verbose: -1

# Model Evaluation
evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1_score
    - roc_auc
  cross_validation:
    enabled: true
    n_splits: 5

# MLflow Configuration
mlflow:
  experiment_name: "sentitube"
  tracking_uri: "./mlruns"
  artifact_location: "./mlartifacts"

# Prediction API
api:
  host: "0.0.0.0"
  port: 8080
  debug: false
  model_path: "./models/best_model.pkl"
  vectorizer_path: "./models/vectorizer.pkl"
